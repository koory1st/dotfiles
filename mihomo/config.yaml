# HTTP 代理端口
port: 7890
# SOCKS5 代理端口
#socks-port: 7891
# Linux 和 macOS 的 redir 代理端口
#redir-port: 7892
# 允许局域网的连接
allow-lan: true

# 规则模式：Rule（规则） / Global（全局代理）/ Direct（全局直连）
mode: Rule

# 设置日志输出级别 (默认级别：silent，即不输出任何内容，以避免因日志内容过大而导致程序内存溢出）。
# 5 个级别：silent / info / warning / error / debug。级别越高日志输出量越大，越倾向于调试，若需要请自行开启。
log-level: silent
# Clash 的 RESTful API
external-controller: '0.0.0.0:9090'

# RESTful API 的口令
secret: '' 

# 您可以将静态网页资源（如 clash-dashboard）放置在一个目录中，clash 将会服务于 `RESTful API/ui`
# 参数应填写配置目录的相对路径或绝对路径。
# external-ui: folder

dns:
  enable: true
  prefer-h3: true
  listen: 127.0.0.1:4096
  default-nameserver:
    - 223.6.6.6
    - 180.184.2.2
  direct-nameserver: 
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  use-hosts: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.81.0.1/16
  nameserver-policy: { +.alipay.com: 223.6.6.6, }
  nameserver:
    - udp://119.29.29.29:53
    - tcp://223.6.6.6:53
  fallback:
    - https://doh.dns.apple.com/dns-query


